data_engineer:
  database_owner:
    - BRONZE_DB
  warehouse_usage:
    - load_wh
  comment: "Ingestion et recreation des tables brutes dans la couche bronze. Owner au niveau database (pas schema) pour que Airbyte puisse creer ses propres schemas (CREATE SCHEMA)"

dbt_runner:
  schema_read:
    - BRONZE_DB.RAW
  database_owner:
    - SILVER_DB
    - GOLD_DB
  warehouse_usage:
    - transform_wh
  comment: "Compte de service dbt, materialise silver et gold depuis bronze. Owner au niveau database (pas schema) pour que dbt puisse creer ses propres schemas (CREATE SCHEMA)"

analyst:
  schema_read:
    - GOLD_DB.MARTS
  warehouse_usage:
    - analytics_wh
  comment: "Lecture seule sur les donnees finales (marts) pour le BI"

monitor:
  schema_read:
    - BRONZE_DB.RAW
    - SILVER_DB.CLEANED
    - GOLD_DB.MARTS
  warehouse_usage:
    - analytics_wh
  comment: "Lecture seule sur les 3 couches, pour verifier volumes/fraicheur depuis Airflow"
